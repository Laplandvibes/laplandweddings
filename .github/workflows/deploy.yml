name: Deploy to Cloudflare Pages

# =============================================================================
# Plain checkout. No cross-repo token, no nesting, no symlink.
#
# HISTORY (why this file used to be 100 lines of scaffolding):
#   src/ imported `../../../shared/*` from the PRIVATE parent monorepo
#   (Laplandvibes/lv-ops). A plain checkout could never build it —
#   `error TS2307: Cannot find module '../../../shared/Footer'` — so the
#   workflow checked out lv-ops alongside with a PAT (LV_MONOREPO_TOKEN),
#   nested the site one level down so ../../../shared resolved, and symlinked
#   parent/node_modules at the site install to avoid bundling two React copies
#   (that bug took laplandweddings.online down on 2026-05-22).
#   The PAT was never created, so `on: push` was commented out and every
#   deploy was manual from a working tree.
#
#   2026-08-21: the shared components are now VENDORED into src/shared/ and
#   read from git, so a plain checkout builds. Verified by cloning this repo
#   outside the monorepo and running npm ci && npm run build — green, and
#   byte-identical CSS to the local build (index-b5-4zeEEAWP.css, 90 117 t).
#   The LV_MONOREPO_TOKEN secret is no longer needed by this workflow.
#
#   Keep src/shared/ in sync with the monorepo via `npm run sync:shared`
#   where that script exists; never hand-edit files under src/shared/.
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time per branch. A push that arrives while a deploy is
# running waits for it; if a newer push arrives meanwhile, the older waiting
# run is dropped (the newer commit contains it), so the newest commit always
# deploys last. Without this, two pushes a few minutes apart deployed in
# parallel and whichever finished last won production.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # ─── LV-PORTIT-CI (13.11.2026) ──────────────────────────────────────────────────────
      # lv-opsin dist-portit ennen julkaisua, sama ajuri ja samat portit kuin deploy-safe.sh:ssa
      # (node scripts/portti.mjs --site <sivusto> --taso dist). lv-ops on yksityinen ja luetaan vain luku
      # -avaimella (lv-opsin deploy key, salaisuus LV_OPS_DEPLOY_KEY). Kaatunut portti PYSÄYTTÄÄ julkaisun.
      # Jos lv-opsia ei saada (avain puuttuu, GitHub-katko), julkaisu jatkuu varoituksella.
      # Hätäohitus: Actions-muuttuja LV_PORTIT_POIS=1 (repo tai organisaatio); kirjaa syy.
      - name: LV-portit — lv-ops (vain luku)
        id: lvops
        if: ${{ vars.LV_PORTIT_POIS != '1' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Laplandvibes/lv-ops
          ssh-key: ${{ secrets.LV_OPS_DEPLOY_KEY }}
          path: _lv-ops

      - name: LV-portit — Node 24 (sama kuin deploy-safe.sh)
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: LV-portit — dist
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        env:
          SIVUSTO_DIR: laplandweddings-new
        run: |
          # Portit etsivät sivuston lv-opsin juuresta (<lv-ops>/<sivusto>), kuten Vesan koneella.
          mv _lv-ops "$RUNNER_TEMP/lv-ops"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lv-ops/$SIVUSTO_DIR"
          cd "$RUNNER_TEMP/lv-ops"
          npm ci --no-audit --no-fund
          node scripts/portti.mjs --site "$SIVUSTO_DIR" --taso dist

      # Julkaisuvaihe ajetaan sivuston omalla Node-versiolla, kuten ennen tätä lohkoa.
      - name: LV-portit — sivuston oma Node takaisin
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: LV-portit — ohitettu
        if: ${{ vars.LV_PORTIT_POIS == '1' || steps.lvops.outcome != 'success' }}
        run: echo "::warning::LV-portit ohitettu (LV_PORTIT_POIS='${{ vars.LV_PORTIT_POIS }}', lv-ops-haku='${{ steps.lvops.outcome }}')"
      # ─── /LV-PORTIT-CI ───────────────────────────────────────────────────────────────────

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=laplandweddings --branch=main
