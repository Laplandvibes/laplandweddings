name: Deploy to Cloudflare Pages

# =============================================================================
# Plain checkout. No cross-repo token, no nesting, no symlink.
#
# HISTORY (why this file used to be 100 lines of scaffolding):
#   src/ imported `../../../shared/*` from the PRIVATE parent monorepo
#   (Laplandvibes/lv-ops). A plain checkout could never build it —
#   `error TS2307: Cannot find module '../../../shared/Footer'` — so the
#   workflow checked out lv-ops alongside with a PAT (LV_MONOREPO_TOKEN),
#   nested the site one level down so ../../../shared resolved, and symlinked
#   parent/node_modules at the site install to avoid bundling two React copies
#   (that bug took laplandweddings.online down on 2026-05-22).
#   The PAT was never created, so `on: push` was commented out and every
#   deploy was manual from a working tree.
#
#   2026-08-21: the shared components are now VENDORED into src/shared/ and
#   read from git, so a plain checkout builds. Verified by cloning this repo
#   outside the monorepo and running npm ci && npm run build — green, and
#   byte-identical CSS to the local build (index-b5-4zeEEAWP.css, 90 117 t).
#   The LV_MONOREPO_TOKEN secret is no longer needed by this workflow.
#
#   Keep src/shared/ in sync with the monorepo via `npm run sync:shared`
#   where that script exists; never hand-edit files under src/shared/.
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=laplandweddings --branch=main
